# The runner is a plain static site: no build step, no API proxy, no SPA fallback.
# Keep the frame-ancestors list identical to vercel.json and to ALLOWED_PARENTS in config.js.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors https://uip-nub.vercel.app http://localhost:5173 http://localhost:4173"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
