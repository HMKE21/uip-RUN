<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>UIP Runner</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; font-family: system-ui, sans-serif; }
    #stage, iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
    #idle { position: fixed; inset: 0; display: grid; place-items: center; color: #6b7280; font-size: 14px; background: #f8fafc; }
    #idle[hidden] { display: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/esbuild-wasm@0.28.1/lib/browser.min.js" integrity="sha384-hX21+UFaeTI9BWzeseCESneXVjRq3EAjRdR0XiJILyEp8GZkR8SNpaonFgkLdEN2" crossorigin="anonymous" defer></script>
  <script type="module" src="./runner.js"></script>
</head>
<body>
  <div id="idle">Press Run to start the preview</div>
  <div id="stage"></div>
</body>
</html>
